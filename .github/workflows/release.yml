name: Release & Build Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages (deb, appimage, rpm)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libasound2-dev \
            libpulse-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            squashfs-tools \
            libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Install frontend dependencies
        run: |
          cd ui
          npm ci || npm install

      - name: Build frontend
        run: |
          cd ui
          npm run build

      - name: Build and Package with Tauri CLI
        env:
          NO_STRIP: "true"
        run: |
          bash scripts/build_packages.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audiover-linux-packages
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event.inputs.release_draft || false }}
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.rpm
            dist/*.deb
            dist/*.AppImage
