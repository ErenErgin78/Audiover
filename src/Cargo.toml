[package]
name = "audiover"
version = "1.0.3"
description = "Audiover Voice Changer and Soundboard Engine"
authors = ["Audiover Contributors"]
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.18.2"
symphonia = { version = "0.6.1", features = ["all"] }
rubato = "5.0.0"
rtrb = "0.4.0"
evdev = "0.13.2"
log = { version = "0.4", features = ["std"] }
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
base64 = "0.23.1"
dirs = "6.0"
rfd = "0.17.2"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
