<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Kapsül iç alanı için maske -->
    <clipPath id="capsule-clip">
      <rect x="194" y="94" width="212" height="432" rx="106" ry="106" />
    </clipPath>
  </defs>

  <style>
    .bg-ellipse {
      fill: #ffffff;
    }
    .stroke-main {
      stroke: #1a1a1a;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .wave-bar {
      fill: #ffffff;
    }
    .c-navy { fill: #0d1b2a; }
    .c-blue { fill: #1b4965; }
    .c-teal { fill: #5bc0be; }

    .crown-gold {
      fill: #f9c74f;
      stroke: #1a1a1a;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <!-- 1. BEYAZ ELİPTİK ARKA PLAN (Kare tuval: 800x800) -->
  <ellipse cx="400" cy="400" rx="360" ry="385" class="bg-ellipse" />

  <!-- 2. MİKROFON GRUBU (Yatayda ortalamak için +100px kaydırıldı) -->
  <g id="retro-microphone" transform="translate(100, 15)">
    <!-- Stand ve Çatal -->
    <path class="stroke-main" d="
      M 130 330 
      L 130 420 
      A 170 170 0 0 0 280 588 
      L 280 670 
      L 220 670 
      L 180 720 
      L 420 720 
      L 380 670 
      L 320 670 
      L 320 588 
      A 170 170 0 0 0 470 420 
      L 470 330
    " />

    <!-- Kapsül İçi (60° Çapraz Bantlar) -->
    <g clip-path="url(#capsule-clip)">
      <rect x="194" y="94" width="212" height="432" class="c-navy" />
      <g transform="rotate(-30 300 310)">
        <rect x="100" y="255" width="400" height="110" class="c-blue" />
        <rect x="100" y="365" width="400" height="400" class="c-teal" />
      </g>
    </g>

    <!-- Kapsül Dış Çerçeve -->
    <rect x="180" y="80" width="240" height="460" rx="120" ry="120" 
          class="stroke-main" stroke-width="16" />

    <!-- Ses Dalgası Barları -->
    <rect x="293" y="160" width="14" height="300" rx="7" class="wave-bar" />
    <rect x="269" y="195" width="14" height="230" rx="7" class="wave-bar" />
    <rect x="317" y="195" width="14" height="230" rx="7" class="wave-bar" />
    <rect x="245" y="230" width="14" height="160" rx="7" class="wave-bar" />
    <rect x="341" y="230" width="14" height="160" rx="7" class="wave-bar" />
    <rect x="221" y="265" width="14" height="90" rx="7" class="wave-bar" />
    <rect x="365" y="265" width="14" height="90" rx="7" class="wave-bar" />

    <!-- Taç -->
    <g id="crown">
      <polygon points="248,82 242,42 272,58 300,28 328,58 358,42 352,82" class="crown-gold" />
      <circle cx="242" cy="42" r="5" fill="#1a1a1a" />
      <circle cx="300" cy="28" r="6" fill="#1a1a1a" />
      <circle cx="358" cy="42" r="5" fill="#1a1a1a" />
    </g>
  </g>
</svg>
